[project]
name = "securemail-rag"
version = "0.1.0"
description = "Permission-aware enterprise email RAG over the Enron Email Dataset"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.3",
  "openai==3.1.0",
  "numpy==2.5.2",
  "rank-bm25==0.2.2",
  "sentence-transformers==5.7.0",
  "torch==2.13.0",
  "pydantic==2.13.4",
  "pytest==9.1.1",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.3",
  "pytest-cov==7.1.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
